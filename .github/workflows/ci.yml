name: Chobra checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          npm --prefix apps/web ci
          cd apps/web
          npx playwright install --with-deps chromium
          echo "CHOBRA_CHROME=$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Create isolated database roles
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres@127.0.0.1:54329/postgres', autocommit=True) as c:
              c.execute('CREATE ROLE chobra_owner LOGIN')
              c.execute('CREATE ROLE chobra_app LOGIN NOSUPERUSER NOBYPASSRLS')
              c.execute('CREATE DATABASE chobra OWNER chobra_owner')
          PY
      - name: Backend tests, types and production build
        run: |
          mkdir -p evidence
          pytest --junitxml=evidence/backend-tests.xml | tee evidence/backend-tests.log
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build | tee evidence/web-build.log
      - name: Browser contracts and real end-to-end flow
        env:
          CHOBRA_AUTH_MODE: dev
          CHOBRA_SECURE_COOKIES: "0"
          CHOBRA_EMBEDDED_WORKER: "1"
          CHOBRA_E2E_REAL: "1"
        run: |
          source scripts/env.sh
          alembic -c services/api/alembic.ini upgrade head
          uvicorn chobra_api.app:app --host 127.0.0.1 --port 8000 > evidence/api.log 2>&1 &
          npm --prefix apps/web run start -- --hostname 127.0.0.1 > evidence/web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/v1/auth/config >/dev/null; then break; fi
            sleep 1
          done
          npm --prefix apps/web run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chobra-checks
          path: |
            evidence/
            apps/web/test-results/
