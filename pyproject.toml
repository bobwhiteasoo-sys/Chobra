[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chobra"
version = "1.0.0"
description = "Chobra: testing incentive rules in executable environments with AI participants"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "anthropic>=2.0",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.28", "playwright>=1.50"]

[project.scripts]
chobra-api = "chobra_api.cli:main"
chobra-worker = "chobra_worker.main:main"

[tool.setuptools.package-dir]
chobra_engine = "packages/engine/chobra_engine"
chobra_envs = "packages/environments/chobra_envs"
chobra_agents = "packages/agents/chobra_agents"
chobra_audit = "packages/audit/chobra_audit"
chobra_reporting = "packages/reporting/chobra_reporting"
chobra_api = "services/api/chobra_api"
chobra_worker = "services/worker/chobra_worker"

[tool.setuptools]
packages = [
  "chobra_engine", "chobra_engine.rules",
  "chobra_envs", "chobra_agents", "chobra_audit", "chobra_audit.checks", "chobra_reporting",
  "chobra_api", "chobra_api.routers", "chobra_worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/engine", "packages/environments", "packages/agents", "packages/audit",
  "packages/reporting", "services/api", "services/worker",
]
addopts = "-q"
